services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: th
      POSTGRES_PASSWORD: ${DB_PASSWORD:-th}
      POSTGRES_DB: th
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U th"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://th:${DB_PASSWORD:-th}@db:5432/th
      PHOTO_DIR: /data/photos
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - photos:/data/photos
      - backups:/data/backups
    # Csak a reverse proxy érje el (HTTPS ott végződik); közvetlen internetre nem szabad kitenni
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
volumes:
  pgdata:
  photos:
  backups:
